name: CI for e11-cli, lambda-home and lambda-leaderboard

on:
  push:
    branches:
      - main
      - dev
  pull_request:

# Cancel in-progress runs when a new run is triggered
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: etc/e11-cli
    env:
      AWS_DEFAULT_REGION: 'us-east-1'
      AWS_ACCESS_KEY_ID: 'minioadmin'
      AWS_SECRET_ACCESS_KEY: 'minioadmin'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.12.5"
          enable-cache: true

      - name: Install Java
        run: |
          sudo apt -y update
          sudo apt -y install openjdk-17-jre-headless
          uv --version
          java -version

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.8"
          cache: false

      - name: Check CLI and Lambdas with DynamoDB Local and MinIO
        run: make email-check

      - name: Check guarded course-table reset with DynamoDB Local
        run: make -C lambda-users-db ddb-empty-test

      - name: Check all maintained uv lockfiles
        run: make -C ../.. uv-check-all

      - name: Install SAM CLI for deployment-bundle checks
        uses: aws-actions/setup-sam@v2
        with:
          version: "1.163.0"

      - name: Enable Linux arm64 container emulation
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Build and invoke the actual Lambda bundles locally
        run: make lambda-build-check
        env:
          SAM_CLI_TELEMETRY: "0"
          AWS_EC2_METADATA_DISABLED: "true"

      - name: list coverage files
        run: |
          find . -name coverage.xml -ls

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: etc/e11-cli/coverage.xml,etc/e11-cli/lambda-home/coverage.xml,etc/e11-cli/lambda-leaderboard/coverage.xml
          flags: unittests
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload test results to Codecov
        uses: codecov/codecov-action@v5
        with:
          report_type: test_results
          files: etc/e11-cli/junit.xml,etc/e11-cli/lambda-home/junit.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
