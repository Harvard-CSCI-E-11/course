name: CI for e11-cli, lambda-home and lambda-leaderboard

on:
  push:
    branches:
      - main
      - dev
      - update-grade
  pull_request:

# Cancel in-progress runs when a new run is triggered
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: etc/e11-cli
    env:
      AWS_DEFAULT_REGION: 'localhost'
      AWS_ENDPOINT_URL: 'http://localhost:8000'
      AWS_ACCESS_KEY_ID: 'minioadmin'
      AWS_SECRET_ACCESS_KEY: 'minioadmin'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v9
        with:
          version: "0.12.5"
          enable-cache: true

      - name: Install Java
        run: |
          sudo apt -y update
          sudo apt -y install openjdk-17-jre-headless
          uv --version
          java -version

      - name: Create default AWS credentials and Validate local DynamoDB endpoint
        run: |
          (make start_local_dynamodb)

      - name: e11 command tests with coverage
        run: |
          make lint
          make check

      - name: lambda-home tests with coverage
        run: |
          (cd lambda-home; make install)
          (cd lambda-home; make lint)
          (cd lambda-home; make check)

      - name: lambda-leaderboard tests with coverage
        run: |
          (cd lambda-leaderboard; make install)
          (cd lambda-leaderboard; make lint)
          (cd lambda-leaderboard; make check)

      - name: list coverage files
        run: |
          find . -name coverage.xml -ls

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: etc/e11-cli/coverage.xml,etc/e11-cli/lambda-home/coverage.xml,etc/e11-cli/lambda-leaderboard/coverage.xml
          flags: unittests
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload test results to Codecov
        uses: codecov/codecov-action@v5
        with:
          report_type: test_results
          files: etc/e11-cli/junit.xml,etc/e11-cli/lambda-home/junit.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
