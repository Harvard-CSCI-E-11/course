[project]
name = "e11"
version = "0.1.1"
description = "CSCI E-11 command for managing submissions to the grader and AWS infrastructure"
authors = [
    { name = "Simson Garfinkel", email = "simsong@acm.org" },
]
license = "GPL-3.0-or-later"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "asyncssh",
    "boto3",
    "crossplane",
    "dnspython",
    "email-validator",
    "itsdangerous",
    "jinja2",
    "paramiko",
    "pydantic",
    "pyjwt",
    "pyyaml",
    "requests",
    "tabulate",
]

[project.scripts]
e11 = "e11.__main__:main"
e11admin = "e11.e11admin.archive_cli:main"

[dependency-groups]
dev = [
    "argparse-manpage",
    "boto3-stubs[route53,s3,sqs]",
    "djlint",
    "flask",
    "matplotlib",
    "mypy-boto3-cloudformation",
    "mypy-boto3-dynamodb",
    "mypy-boto3-ec2",
    "mypy-boto3-lambda",
    "mypy-boto3-rds",
    "mypy-boto3-route53",
    "mypy-boto3-secretsmanager",
    "mypy-boto3-ses",
    "numpy",
    "pandas",
    "pylint",
    "pyright",
    "pytest",
    "pytest-cov",
    "ruff",
    "types-boto3",
    "types-requests",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "e11"
module-root = ""

[tool.pylint.main]
py-version = "3.14"

[tool.pylint.messages_control]
disable = [
    "missing-module-docstring",
    "missing-class-docstring",
    "missing-function-docstring",
    "line-too-long",
    "unspecified-encoding",
    "trailing-whitespace",
    "too-many-locals",
]

[tool.pylint.design]
max-args = 10
max-branches = 20
max-public-methods = 20

[tool.pyright]
pythonVersion = "3.14"
venvPath = "./"
venv = ".venv"
include = ["."]
exclude = [
  "**/build",
  "**/.aws-sam",
  "**/.mypy_cache",
  "**/.pytest_cache",
  "**/__pycache__",
  "**/conftest.py",
]
typeCheckingMode = "basic"
reportMissingTypeStubs = "warning"

[[tool.pyright.executionEnvironments]]
root = "."
extraPaths = ["e11"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [
 "e11",
 "tests",
]
addopts = "-ra -q"
python_files = ["test_*.py"]

[tool.build_manpages]
manpages = ["man/e11.1:function=get_parser:pyfile=e11/main.py:author=Simson L. Garfinkel"]
