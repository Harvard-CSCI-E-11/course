[project]
name = "lambda-home"
version = "0.1.1"
description = "CSCI E-11 home page"
authors = [
    { name = "Simson Garfinkel", email = "simsong@acm.org" },
]
license = "GPL-3.0-or-later"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "e11",
    "boto3",
    "boto3-stubs[essential,route53,secretsmanager,dynamodb,s3]",
    "crossplane",
    "dnspython",
    "email-validator",
    "itsdangerous",
    "jinja2",
    "paramiko",
    "pydantic",
    "pyjwt",
    "pyyaml",
    "requests",
    "tabulate",
]

[dependency-groups]
dev = [
    "djlint",
    "flask",
    "mypy-boto3-dynamodb",
    "mypy-boto3-route53",
    "mypy-boto3-secretsmanager",
    "mypy-boto3-ses",
    "pylint",
    "pyright",
    "pytest",
    "pytest-cov",
    "ruff",
    "types-requests",
]

[tool.uv]
package = false

[tool.uv.sources]
e11 = { path = ".." }

[tool.djlint]
profile = "jinja"
ignore = ["jinja-block", "jinja-variable", "J004", "J018"]
indent = 4

[tool.ruff.lint.isort]
known-first-party = ["e11", "home_app"]

[tool.pylint]
py-version = "3.14"
ignore-paths = [
    "src/e11/.*",
]
source-roots = [".."]

[tool.pylint.FORMAT]
max-line-length = 200

[tool.pylint.messages_control]
disable = [
    "missing-module-docstring",
    "missing-class-docstring",
    "missing-function-docstring",
    "line-too-long",
    "unspecified-encoding",
    "too-few-public-methods",
    "trailing-whitespace",
]

[tool.pylint.design]
max-args = 10
max-public-methods = 20

[tool.pyright]
pythonVersion = "3.14"
venvPath = "."
venv = ".venv"
include = ["src"]
exclude = [
  "**/build",
  "**/.aws-sam",
  "**/.venv",
  "**/.mypy_cache",
  "**/.pytest_cache",
  "**/__pycache__",
  "src/e11",
]
typeCheckingMode = "basic"
reportMissingTypeStubs = "warning"

[[tool.pyright.executionEnvironments]]
root = "."
extraPaths = ["src", "../"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [
 "src",
 "tests",
 "../",
]
addopts = "-ra -q"
