[project]
name = "lab8-memento"
version = "1.0.0"
description = "Lab 8 tools for MEMENTO"
authors = [
    { name = "Simson Garfinkel", email = "simsong@acm.org" },
]
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "adafruit-circuitpython-neopixel",
    "circuitpython-stubs",
    "pyright",
    "requests",
]

[dependency-groups]
dev = [
    "adafruit-circuitpython-pycamera",
    "djlint",
    "pylint",
]

[tool.uv]
package = false

[tool.pylint.main]
ignored-modules = [
    "wifi",
    "socketpool",
    "adafruit_ntp",
    "bitmaptools",
    "displayio",
    "gifio",
    "rtc",
    "ulab.numpy",
    "adafruit_requests",
    "adafruit_pycamera",
]

[tool.pylint.basic]
good-names = ["photo_count", "free_bytes", "total_bytes"]

[tool.pylint]
disable = [
    "duplicate-code",
    "protected-access",
]

[tool.pyright]
typeCheckingMode = "standard"
reportMissingModuleSource = "none"
reportMissingImports = "none"
