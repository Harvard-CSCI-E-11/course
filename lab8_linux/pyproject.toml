[project]
name = "lab8-linux"
version = "1.0.0"
description = "Lab 8 Linux client to post to the dashboard"
authors = [
    { name = "Simson Garfinkel", email = "simsong@acm.org" },
]
requires-python = ">=3.14,<3.15"
dependencies = [
    "adafruit-circuitpython-neopixel",
    "circuitpython-stubs",
    "requests",
]

[dependency-groups]
dev = [
    "djlint",
    "pylint",
    "pyright",
]

[tool.uv]
package = false

[tool.pylint.main]
ignored-modules = [
    "wifi",
    "socketpool",
    "adafruit_requests",
    "adafruit_pycamera",
]

[tool.pyright]
typeCheckingMode = "standard"
reportMissingModuleSource = "none"
reportMissingImports = "none"
