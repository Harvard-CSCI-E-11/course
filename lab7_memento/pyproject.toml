[project]
name = "lab7-memento"
version = "1.0.0"
description = "Lab 7 CircuitPython and ESP32 tools"
authors = [
    { name = "Simson Garfinkel", email = "simsong@acm.org" },
]
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "adafruit-ampy",
    "adafruit-blinka",
    "circup",
    "circuitpython-stubs",
    "pylint",
]

[dependency-groups]
dev = [
    "adafruit-circuitpython-pycamera",
    "pyright",
]

[tool.uv]
package = false

[tool.pylint.basic]
good-names = ["VELOCITY_X", "VELOCITY_Y", "speaker"]

[tool.pylint.main]
ignored-modules = [
    "adafruit_display_shapes",
    "board",
    "digitalio",
    "displayio",
    "microcontroller",
    "busio",
    "wifi",
    "vectorio",
]

[tool.pyright]
venvPath = "."
venv = ".venv"
reportMissingModuleSource = false
reportMissingImports = "warning"
