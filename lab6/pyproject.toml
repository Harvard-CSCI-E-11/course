[project]
name = "lab6"
version = "1.0.0"
description = "Lab 6 server"
authors = [
    { name = "Simson Garfinkel", email = "simsong@acm.org" },
]
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "boto3",
    "click",
    "flask",
    "gunicorn",
    "pillow",
    "tabulate",
]

[dependency-groups]
dev = [
    "djlint",
    "pylint",
    "pyright",
    "types-flask",
]

[tool.uv]
package = false

[tool.pylint.variables]
dummy-variables-rgx = "^(api_|route_).*"
